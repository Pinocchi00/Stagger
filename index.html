<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grimalkin</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; background: #000; touch-action: none; }
  #debug { position: fixed; top: 0; left: 0; padding: 6px 8px; font: 12px monospace; color: #bbb; background: rgba(0,0,0,.55); pointer-events: none; line-height: 1.5; }
  #debug button { pointer-events: auto; font: inherit; color: #ddd; background: #222; border: 1px solid #555; min-width: 36px; min-height: 28px; margin-left: 4px; }
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="debug" hidden>
  <div id="d-ecart">–</div>
  <div id="d-serie"></div>
  <div><span id="d-decalage"></span><button id="d-moins">−</button><button id="d-plus">+</button></div>
</div>
<script src="settings.js"></script>
<script src="jeu.js"></script>
</body>
</html>
