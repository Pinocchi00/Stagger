<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stagger</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; background: #000; }
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<script src="settings.js"></script>
<script>
(() => {
  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');

  function ajuster() {
    const d = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * d);
    canvas.height = Math.round(window.innerHeight * d);
  }
  window.addEventListener('resize', ajuster);
  ajuster();

  const pas = 1000 / SETTINGS.fps;
  let dernier = 0;
  function boucle(now) {
    requestAnimationFrame(boucle);
    if (now - dernier < pas - 1) return;
    dernier = now;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
